function qbetween(a,b){let x=a[1]*b[2]-a[2]*b[1],y=a[2]*b[0]-a[0]*b[2],z=a[0]*b[1]-a[1]*b[0],w=1+a[0]*b[0]+a[1]*b[1]+a[2]*b[2];if(w<1e-6){if(Math.abs(a[0])<Math.abs(a[1])){x=0;y=-a[2];z=a[1]}else{x=-a[2];y=0;z=a[0]}w=0}return nq([x,y,z,w])}
function resetGesture(){let a=[...pts.values()];if(a.length===1)gesture={mode:1,arc:arcball(a[0]),dist:0,center:null};else if(a.length===2){gesture={mode:2,arc:null,dist:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]),center:[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2]}}else gesture={mode:0,arc:null,dist:0,center:null}}
canvas.onpointerdown=e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);resetGesture();document.querySelector('.controls').classList.remove('open');document.querySelector('.metrics').classList.remove('open')};
canvas.onpointermove=e=>{if(!pts.has(e.pointerId))return;e.preventDefault();pts.set(e.pointerId,[e.clientX,e.clientY]);let a=[...pts.values()],scale=Math.max(1,Math.min(canvas.clientWidth,canvas.clientHeight));if(a.length===1&&gesture.mode===1){if(e.pointerType==='mouse'&&(e.shiftKey||e.buttons===2)){let prev=gesture.arc,now=arcball(a[0]);pan[0]+=(now[0]-prev[0]);pan[1]+=(now[1]-prev[1]);gesture.arc=now}else{let now=arcball(a[0]),dq=qbetween(gesture.arc,now);q=nq(qm(dq,q));gesture.arc=now}dirty=true}else if(a.length===2&&gesture.mode===2){let d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]),c=[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2];if(gesture.dist>1)setZoom(zoom*gesture.dist/Math.max(d,1));pan[0]+=(c[0]-gesture.center[0])*2/scale;pan[1]-=(c[1]-gesture.center[1])*2/scale;gesture.dist=d;gesture.center=c;dirty=true}};
function up(e){pts.delete(e.pointerId);resetGesture()}canvas.onpointerup=canvas.onpointercancel=canvas.onlostpointercapture=up;canvas.oncontextmenu=e=>e.preventDefault();canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*Math.exp(e.deltaY*.001));dirty=true},{passive:false});canvas.ondblclick=()=>{$('#reset').click()};
for(const id of ['P','S','L','threshold','size','depthX','occlusion'])$('#'+id).oninput=()=>{$('#thresholdOut').value=(+$('#threshold').value).toFixed(2);$('#sizeOut').value=(+$('#size').value).toFixed(2);$('#depthOut').value=(+$('#depthX').value).toFixed(1);dirty=true};$('#landOpacity').oninput=()=>{syncLandOpacity();dirty=true};$('#magnification').oninput=e=>setMagnification(e.target.value);for(const id of ['ambient','wrap','roughness','lightAz','lightEl'])$('#'+id).oninput=()=>{$('#ambientOut').value=(+$('#ambient').value).toFixed(2);$('#wrapOut').value=(+$('#wrap').value).toFixed(2);$('#roughnessOut').value=(+$('#roughness').value).toFixed(2);$('#lightAzOut').value=Math.round(+$('#lightAz').value)+'°';$('#lightElOut').value=Math.round(+$('#lightEl').value)+'°';dirty=true};$('#backgroundTheme').onchange=e=>setBackgroundTheme(e.target.value);restoreBackgroundTheme();window.__lightingControls={ids:['ambient','wrap','roughness','lightAz','lightEl'],defaults:{"ambient":0.46,"wrap":0.55,"roughness":0.78,"azimuth_deg":-35.0,"elevation_deg":50.0,"specular_intensity":0.055,"rim_intensity":0.055,"basis_weight":0.22},backgrounds:{light:[.82,.88,.91,1],dark:[.008,.025,.04,1]}};$('#model').onchange=()=>loadModel().catch(e=>status.textContent=e.message);$('#reset').onclick=()=>{q=[.965,-.14,.205,.075];setZoom(ZOOM_DEFAULT);pan=[0,0,0];dirty=true};$('#top').onclick=()=>{q=[0,0,0,1];setZoom(1);pan=[0,0,0];dirty=true};$('#fit').onclick=()=>{setZoom(.72);pan=[0,0,0];dirty=true};syncLandOpacity();syncMagnification();

const controlSheet=document.querySelector('.controls'),metricSheet=document.querySelector('.metrics');
const mobileSettings=$('#mobileSettings');if(mobileSettings)mobileSettings.onclick=()=>{metricSheet.classList.remove('open');controlSheet.classList.toggle('open')};
const mobileInfo=$('#mobileInfo');if(mobileInfo)mobileInfo.onclick=()=>{controlSheet.classList.remove('open');metricSheet.classList.toggle('open')};
const sheetClose=$('#sheetClose');if(sheetClose)sheetClose.onclick=()=>controlSheet.classList.remove('open');
const mobileReset=$('#mobileReset');if(mobileReset)mobileReset.onclick=()=>$('#reset').click();const mobileTop=$('#mobileTop');if(mobileTop)mobileTop.onclick=()=>$('#top').click();

function setMobileSheet(kind,open){const controls=kind==='controls'?controlSheet:metricSheet,other=kind==='controls'?metricSheet:controlSheet;other.classList.remove('open');controls.classList.toggle('open',open);mobileSettings.setAttribute('aria-expanded',String(kind==='controls'&&open));mobileInfo.setAttribute('aria-expanded',String(kind==='metrics'&&open));document.documentElement.classList.toggle('sheetOpen',open)}
mobileSettings.onclick=()=>setMobileSheet('controls',!controlSheet.classList.contains('open'));mobileInfo.onclick=()=>setMobileSheet('metrics',!metricSheet.classList.contains('open'));sheetClose.onclick=()=>setMobileSheet('controls',false);mobileTop.onclick=()=>$('#top').click();$('#mobileOblique').onclick=()=>{q=[.965,-.14,.205,.075];dirty=true};mobileReset.onclick=()=>$('#reset').click();
document.addEventListener('pointerdown',event=>{if(!controlSheet.classList.contains('open')&&!metricSheet.classList.contains('open'))return;if(controlSheet.contains(event.target)||metricSheet.contains(event.target)||document.getElementById('mobileControls').contains(event.target))return;setMobileSheet('controls',false);setMobileSheet('metrics',false)},true);document.addEventListener('keydown',event=>{if(event.key==='Escape'){setMobileSheet('controls',false);setMobileSheet('metrics',false)}});
